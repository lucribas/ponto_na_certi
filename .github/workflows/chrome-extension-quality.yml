name: Chrome extension quality

on:
  workflow_call:
  pull_request:
    paths:
      - "apps/chrome-extension/**"
      - ".github/workflows/chrome-extension-*.yml"
  push:
    branches:
      - main
    paths:
      - "apps/chrome-extension/**"
      - ".github/workflows/chrome-extension-*.yml"

permissions:
  contents: read

concurrency:
  group: chrome-extension-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, build and package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/chrome-extension

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/chrome-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, parity, integration and browser tests
        run: npm test

      - name: Packaged extension smoke test in headless Chrome
        run: npm run test:chrome-headless

      - name: Create reproducible ZIP
        run: npm run package

      - name: Validate release metadata and installation website
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: node scripts/build-release-site.mjs

      - name: Upload installable package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: chrome-extension-package
          path: |
            apps/chrome-extension/artifacts/*.zip
            apps/chrome-extension/artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: chrome-extension-playwright-report
          path: apps/chrome-extension/playwright-report
          if-no-files-found: ignore
          retention-days: 7
