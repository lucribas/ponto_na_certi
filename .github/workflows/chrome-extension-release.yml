name: Release Chrome extension
run-name: Release da extensão a partir de ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      publish_pages:
        description: Publicar também o site de instalação no GitHub Pages
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: chrome-extension-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release branch
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
            echo "Execute a release a partir da branch ${DEFAULT_BRANCH}; a branch atual é ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

  quality:
    name: Validate release candidate
    needs: preflight
    uses: ./.github/workflows/chrome-extension-quality.yml
    secrets: inherit

  prepare:
    name: Prepare release metadata
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.site.outputs.version }}
      tag: ${{ steps.site.outputs.tag }}

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download validated package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: chrome-extension-package
          path: apps/chrome-extension/artifacts

      - name: Build release website and checksums
        id: site
        working-directory: apps/chrome-extension
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: node scripts/build-release-site.mjs

      - name: Reject an existing release tag
        env:
          RELEASE_TAG: ${{ steps.site.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "A tag ${RELEASE_TAG} já existe. Atualize package.json e manifest.json antes de publicar novamente." >&2
            exit 1
          fi

  publish-release:
    name: Create tag and GitHub Release
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Download validated release files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: chrome-extension-package
          path: artifacts

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_ZIP: artifacts/ponto-na-certi-extension-${{ needs.prepare.outputs.version }}.zip
        run: >-
          gh release create "${RELEASE_TAG}"
          "${RELEASE_ZIP}#Extensão Chrome (ZIP para instalação manual)"
          "artifacts/SHA256SUMS.txt#Checksum SHA-256"
          --repo "${GITHUB_REPOSITORY}"
          --target "${GITHUB_SHA}"
          --title "Ponto na Certi ${RELEASE_VERSION}"
          --generate-notes
          --latest

  deploy-pages:
    name: Publish optional installation website
    if: ${{ inputs.publish_pages }}
    needs:
      - prepare
      - publish-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download released package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: chrome-extension-package
          path: apps/chrome-extension/artifacts

      - name: Build installation website
        working-directory: apps/chrome-extension
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: node scripts/build-release-site.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: apps/chrome-extension/release-site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
