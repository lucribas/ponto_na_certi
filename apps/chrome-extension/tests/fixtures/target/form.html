<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Channel sintético — apontamento</title>
  </head>
  <body>
    <form id="apontamento_diario">
      <input id="tpApontamentoProjeto" type="radio" name="tipo" />
      <select id="apontamento.projetosSelecionado">
        <option>Nenhum</option>
        <option value="p1">PROJETO_SINTETICO — descrição</option>
        <option value="p2">OUTRO_PROJETO</option>
      </select>
      <select id="apontamento.idTipoAtividadeProjeto">
        <option>Nenhum</option>
        <option value="tipo">TIPO_SINTETICO — descrição</option>
      </select>
      <select id="apontamento.notificacaoSelecionada">
        <option>Nenhum</option>
        <option value="a1">ATIVIDADE_SINTETICA — descrição</option>
      </select>
      <select id="apontamento.idTarefa">
        <option>Nenhum</option>
        <option value="t1">TAREFA_SINTETICA — descrição</option>
      </select>
      <input id="data" value="" />
      <input id="apontamento.duracao" value="" />
      <button name="btnSalvar" type="submit">Salvar</button>
    </form>
  </body>
</html>
